<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M-seleni</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#DC2626">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M-seleni">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<style>
:root{
  --navy:#0b1f33; --ink:#12263a; --muted:#6b7c8d; --line:#e6edf3;
  --brand:#0ea5a4; --brand-dark:#0b7a8a; --accent:#f5a524;
  --ok:#12a150; --bad:#d64545; --bg:#f3f7fa; --card:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--navy);color:var(--ink);display:flex;justify-content:center}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media(min-width:600px){
  body{align-items:center;padding:24px 0}
  #app{min-height:0;height:min(860px,calc(100vh - 48px));border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45)}
}
.banner{background:var(--accent);color:#3b2600;font-size:12px;font-weight:600;text-align:center;padding:6px 10px}

/* auth */
.auth{flex:1;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--navy) 0%,#0f4c5c 100%);color:#fff;overflow-y:auto}
.auth-top{padding:48px 28px 24px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:30px;font-weight:800;letter-spacing:-.5px}
.logo .m{width:46px;height:46px;border-radius:14px;background:var(--brand);display:grid;place-items:center;font-size:26px;color:#fff;box-shadow:0 6px 16px rgba(14,165,164,.45)}
.tag{margin-top:8px;font-size:14px;opacity:.8}
.auth-card{background:var(--card);color:var(--ink);border-radius:24px 24px 0 0;padding:22px 24px 28px;margin-top:auto;min-height:340px}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
input:focus{border-color:var(--brand)}
.btn{width:100%;margin-top:18px;padding:13px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700}
.btn:active{background:var(--brand-dark)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.hint{margin-top:14px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.hint b{color:var(--ink)}
.linkbtn{color:var(--brand-dark);font-weight:600;font-size:12px;text-decoration:underline}

/* app */
.top{background:linear-gradient(160deg,var(--navy),#0f4c5c);color:#fff;padding:18px 20px 70px}
.top-row{display:flex;justify-content:space-between;align-items:center}
.hi{font-size:13px;opacity:.8}
.name{font-size:18px;font-weight:700}
.logout{font-size:12px;padding:7px 12px;border-radius:20px;background:rgba(255,255,255,.14);color:#fff}
.main{flex:1;overflow-y:auto;padding:0 16px 90px;margin-top:-52px}
.top.slim{padding-bottom:22px}
.main.flat{margin-top:0;padding-top:14px}
.bal{background:var(--card);border-radius:20px;padding:18px 20px;box-shadow:0 8px 24px rgba(11,31,51,.14)}
.bal small{color:var(--muted);font-size:12px;font-weight:600}
.bal .amt{font-size:34px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px;display:flex;align-items:center;gap:10px}
.eye{font-size:16px;opacity:.6}
.acct{font-size:12px;color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.act{background:var(--card);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;box-shadow:0 2px 8px rgba(11,31,51,.06)}
.act .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:#e3f6f6}
.act.send .ic{background:#fff1d6}
.act.bill .ic{background:#e6ecff}
h3{font-size:15px;margin:6px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.list{background:var(--card);border-radius:16px;padding:4px 14px;box-shadow:0 2px 8px rgba(11,31,51,.06)}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:none}
.ic.in{background:#e1f5ea}.ic.out{background:#fde7e7}.ic.cash{background:#e3f6f6}.ic.bill{background:#fff1d6}
.tx .t{flex:1;min-width:0}
.tx .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t span{font-size:12px;color:var(--muted)}
.tx .a{font-weight:700;font-size:14px;white-space:nowrap}
.a.pos{color:var(--ok)}.a.neg{color:var(--bad)}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px}
.panel{background:var(--card);border-radius:18px;padding:6px 18px 20px;box-shadow:0 2px 8px rgba(11,31,51,.06);margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{padding:7px 12px;border-radius:20px;background:var(--bg);font-size:13px;font-weight:600;border:1.5px solid var(--line)}
.chip:active{border-color:var(--brand)}
.title{font-size:20px;font-weight:800;margin:6px 2px 8px}
.biller{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(11,31,51,.06)}
.biller:active{background:#f0f6f9}
.biller .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:#fff1d6;flex:none}
.biller .bt{flex:1;min-width:0}
.biller .bt b{display:block;font-size:16px}
.biller .bt span{font-size:12px;color:var(--muted)}
.biller .go{font-size:24px;color:var(--muted)}
.back{font-size:13px;font-weight:600;color:var(--brand-dark);padding:6px 2px}
.paying{font-size:13px;color:var(--muted);padding:12px 0 2px}
.paying b{color:var(--ink)}
.token{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px}
.fine{font-size:12px;color:var(--muted);margin-top:10px}
.nav{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px}
.nav button .e{font-size:20px}
.nav button.on{color:var(--brand-dark)}

/* modal + toast */
.overlay{position:absolute;inset:0;background:rgba(11,31,51,.55);display:flex;align-items:flex-end;z-index:10}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:22px 22px 28px;max-height:92%;overflow-y:auto}
.sheet h2{font-size:18px;margin-bottom:4px}
.sheet p.s{font-size:13px;color:var(--muted)}
.receipt{text-align:center}
.check{width:64px;height:64px;border-radius:50%;background:#e1f5ea;color:var(--ok);display:grid;place-items:center;font-size:32px;margin:6px auto 10px}
.receipt .big{font-size:30px;font-weight:800;margin:6px 0}
.rows{margin-top:14px;text-align:left;border-top:1px dashed var(--line)}
.rows div{display:flex;justify-content:space-between;padding:9px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.rows span{color:var(--muted)}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:20;max-width:88%;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.toast.err{background:var(--bad)}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  /* ---------- helpers ---------- */
  var KEY = "mseleni_demo_v1";
  var SESSION_KEY = "mseleni_demo_session";
  var MAX_AMOUNT = 50000;
  var BILLERS = {
    cashpower: { label: "Cashpower", company: "Solomon Power", icon: "\uD83D\uDCA1", note: "Prepaid electricity", field: "Meter number", hint: "e.g. 04123456789" },
    cashwater: { label: "Cashwater", company: "Solomon Water", icon: "\uD83D\uDCA7", note: "Water bill", field: "Account number", hint: "e.g. 20481234" }
  };

  function $(s) { return document.querySelector(s); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function peso(n) {
    return "\u20B1" + Number(n).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function round2(n) { return Math.round(n * 100) / 100; }
  function newRef() { return "MS" + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 36).toString(36).toUpperCase(); }
  function fmtDate(ts) {
    return new Date(ts).toLocaleString("en-PH", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }

  /* ---------- fake database (browser only) ---------- */
  function seed() {
    return {
      users: {
        demo:  { name: "Demo User",    pin: "1234", balance: 1000, tx: [] },
        maria: { name: "Maria Santos", pin: "1111", balance: 500,  tx: [] },
        juan:  { name: "Juan Dela Cruz", pin: "2222", balance: 750, tx: [] }
      }
    };
  }
  function setDB(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
  function getDB() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    var d = seed();
    setDB(d);
    return d;
  }
  var DB = getDB();

  /* ---------- state ---------- */
  var me = null;
  try { me = sessionStorage.getItem(SESSION_KEY); } catch (e) {}
  var tab = "home";
  var authMode = "login";
  var hideBal = false;
  var biller = null;      // which biller form is open on the Bills tab
  var modal = null;       // {type:'topup'} | {type:'receipt', tx:{...}}
  var toastTimer = null;

  function toast(msg, isErr) {
    var old = $(".toast");
    if (old) old.remove();
    var el = document.createElement("div");
    el.className = "toast" + (isErr ? " err" : "");
    el.textContent = msg;
    $("#app").appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.remove(); }, 2600);
  }

  /* ---------- views ---------- */
  function renderAuth() {
    var isReg = authMode === "register";
    $("#app").innerHTML =
      '<div class="banner">DEMO ONLY &mdash; fake money, no real payments</div>' +
      '<div class="auth">' +
        '<div class="auth-top"><div class="logo"><span class="m">M</span><span>-seleni</span></div>' +
        '<div class="tag">Your pocket e-wallet</div></div>' +
        '<div class="auth-card">' +
          '<div class="tabs">' +
            '<button data-auth="login" class="' + (!isReg ? "on" : "") + '">Log in</button>' +
            '<button data-auth="register" class="' + (isReg ? "on" : "") + '">Register</button>' +
          '</div>' +
          '<form id="' + (isReg ? "f-register" : "f-login") + '" autocomplete="off">' +
            (isReg ? '<label>Full name</label><input name="name" maxlength="30" required placeholder="e.g. Ana Reyes">' : "") +
            '<label>Username</label><input name="user" maxlength="16" required placeholder="letters, numbers, underscore" autocapitalize="none">' +
            '<label>4-digit PIN</label><input name="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required placeholder="&bull;&bull;&bull;&bull;">' +
            '<button class="btn" type="submit">' + (isReg ? "Create account (\u20B1500 free)" : "Log in") + '</button>' +
          '</form>' +
          '<div class="hint">Try <b>demo</b> / PIN <b>1234</b>, or <b>maria</b> / <b>1111</b><br>' +
          '<button class="linkbtn" data-action="reset">Reset demo data</button></div>' +
        '</div>' +
      '</div>';
  }

  function txRow(t) {
    var other = DB.users[t.other] ? DB.users[t.other].name : t.other;
    var icon, cls, title, sign;
    var bi = BILLERS[t.other];
    if (t.type === "bill" && bi) { icon = bi.icon; cls = "bill"; title = bi.label + " \u00B7 " + bi.company; sign = "-"; }
    else if (t.type === "topup") { icon = "\u2B07"; cls = "cash"; title = "Cash in"; sign = "+"; }
    else if (t.type === "received") { icon = "\u2199"; cls = "in"; title = "From " + other; sign = "+"; }
    else { icon = "\u2197"; cls = "out"; title = "To " + other; sign = "-"; }
    var sub = fmtDate(t.ts) + (t.note ? " \u00B7 " + t.note : "");
    return '<div class="tx"><div class="ic ' + cls + '">' + icon + '</div>' +
      '<div class="t"><b>' + esc(title) + '</b><span>' + esc(sub) + '</span></div>' +
      '<div class="a ' + (sign === "+" ? "pos" : "neg") + '">' + sign + peso(t.amount) + '</div></div>';
  }

  function txList(arr) {
    if (!arr.length) return '<div class="list"><div class="empty">No transactions yet.</div></div>';
    return '<div class="list">' + arr.map(txRow).join("") + '</div>';
  }

  function homeView(u) {
    return '' +
      '<div class="bal"><small>Available balance</small>' +
        '<div class="amt"><span>' + (hideBal ? "\u20B1 \u2022\u2022\u2022\u2022\u2022\u2022" : peso(u.balance)) + '</span>' +
        '<button class="eye" data-action="toggle-bal" aria-label="Show or hide balance">' + (hideBal ? "\uD83D\uDE48" : "\uD83D\uDC41") + '</button></div>' +
        '<div class="acct">@' + esc(me) + ' &middot; M-seleni account</div></div>' +
      '<div class="actions">' +
        '<button class="act" data-action="open-topup"><span class="ic">\uD83D\uDCB5</span>Top up</button>' +
        '<button class="act send" data-tab="send"><span class="ic">\uD83D\uDCE4</span>Send</button>' +
        '<button class="act bill" data-tab="bills"><span class="ic">\uD83D\uDCCB</span>Bills</button>' +
      '</div>' +
      '<h3>Recent activity</h3>' +
      txList(u.tx.slice(0, 8));
  }

  function sendView() {
    return '' +
      '<div class="title">Send money</div>' +
      '<div class="panel">' +
        '<form id="f-send">' +
          '<label>To username</label><input name="to" required placeholder="e.g. maria" autocapitalize="none">' +
          '<label>Amount</label><input name="amount" type="number" inputmode="decimal" min="1" max="' + MAX_AMOUNT + '" step="0.01" required placeholder="0.00">' +
          '<label>Note (optional)</label><input name="note" maxlength="40" placeholder="For lunch">' +
          '<button class="btn" type="submit">Send</button>' +
        '</form>' +
      '</div>';
  }

  function billsView() {
    if (biller) {
      var b = BILLERS[biller];
      return '' +
        '<button class="back" data-action="back-biller">&larr; All billers</button>' +
        '<div class="title">' + esc(b.label) + '</div>' +
        '<div class="paying">Paying <b>' + esc(b.company) + '</b> &middot; ' + esc(b.note) + '</div>' +
        '<div class="panel">' +
          '<form id="f-bill">' +
            '<label>' + esc(b.field) + '</label><input name="ref" required placeholder="' + esc(b.hint) + '">' +
            '<label>Amount</label><input name="amount" type="number" inputmode="decimal" min="1" max="' + MAX_AMOUNT + '" step="0.01" required placeholder="0.00">' +
            '<button class="btn" type="submit">Pay now</button>' +
          '</form>' +
          '<div class="fine">A reference token will appear after payment.</div>' +
        '</div>';
    }
    return '' +
      '<div class="title">Pay bills</div>' +
      '<button class="biller" data-biller="cashpower"><span class="ic">\uD83D\uDCA1</span><div class="bt"><b>Cashpower</b><span>Solomon Power &middot; Prepaid electricity</span></div><span class="go">&rsaquo;</span></button>' +
      '<button class="biller" data-biller="cashwater"><span class="ic">\uD83D\uDCA7</span><div class="bt"><b>Cashwater</b><span>Solomon Water &middot; Water bill</span></div><span class="go">&rsaquo;</span></button>';
  }

  function historyView(u) {
    return '<div class="title">Activity</div>' + txList(u.tx);
  }

  function modalHTML() {
    if (!modal) return "";
    if (modal.type === "topup") {
      return '<div class="overlay" data-action="close-modal"><div class="sheet" onclick="event.stopPropagation()">' +
        '<h2>Top up</h2><p class="s">Add fake cash to your wallet</p>' +
        '<form id="f-topup">' +
          '<label>Amount</label><input name="amount" type="number" inputmode="decimal" min="1" max="' + MAX_AMOUNT + '" step="0.01" required placeholder="0.00" autofocus>' +
          '<div class="chips">' +
            '<button type="button" class="chip" data-chip="100">\u20B1100</button>' +
            '<button type="button" class="chip" data-chip="500">\u20B1500</button>' +
            '<button type="button" class="chip" data-chip="1000">\u20B11,000</button>' +
            '<button type="button" class="chip" data-chip="5000">\u20B15,000</button>' +
          '</div>' +
          '<button class="btn" type="submit">Add money</button>' +
          '<button class="btn ghost" type="button" data-action="close-modal" style="margin-top:8px">Cancel</button>' +
        '</form></div></div>';
    }
    if (modal.type === "receipt") {
      var t = modal.tx;
      var rows = "";
      if (t.type === "topup") rows = '<div><span>Type</span><b>Cash in</b></div><div><span>Reference</span><b class="token">' + esc(t.ref) + '</b></div>';
      else if (t.type === "send" || t.type === "received") {
        rows = '<div><span>To / From</span><b>' + esc(t.other) + '</b></div>' +
               (t.note ? '<div><span>Note</span><b>' + esc(t.note) + '</b></div>' : "") +
               '<div><span>Reference</span><b class="token">' + esc(t.ref) + '</b></div>';
      } else if (t.type === "bill") {
        var bi = BILLERS[t.other] || {};
        rows = '<div><span>Biller</span><b>' + esc(bi.label || t.other) + '</b></div>' +
               '<div><span>' + esc(bi.field || "Reference") + '</span><b>' + esc(t.note || "") + '</b></div>' +
               '<div><span>Token</span><b class="token">' + esc(t.ref) + '</b></div>';
      }
      return '<div class="overlay" data-action="close-modal"><div class="sheet receipt" onclick="event.stopPropagation()">' +
        '<div class="check">\u2713</div>' +
        '<div class="big">' + (t.type === "topup" || t.type === "received" ? "+" : "-") + peso(t.amount) + '</div>' +
        '<p class="s">' + fmtDate(t.ts) + '</p>' +
        '<div class="rows">' + rows + '</div>' +
        '<button class="btn" data-action="close-modal" style="margin-top:18px">Done</button>' +
        '</div></div>';
    }
    return "";
  }

  function render() {
    if (!me || !DB.users[me]) {
      me = null;
      try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
      renderAuth();
      return;
    }
    var u = DB.users[me];
    var body = "";
    if (tab === "home") body = homeView(u);
    else if (tab === "send") body = sendView();
    else if (tab === "bills") body = billsView();
    else if (tab === "history") body = historyView(u);

    $("#app").innerHTML =
      '<div class="banner">DEMO ONLY &mdash; fake money, no real payments</div>' +
      '<div class="top' + (tab !== "home" ? " slim" : "") + '">' +
        '<div class="top-row"><div><div class="hi">Hello</div><div class="name">' + esc(u.name) + '</div></div>' +
        '<button class="logout" data-action="logout">Log out</button></div></div>' +
      '<div class="main' + (tab !== "home" ? " flat" : "") + '">' + body + '</div>' +
      '<div class="nav">' +
        '<button data-tab="home" class="' + (tab === "home" ? "on" : "") + '"><span class="e">\uD83C\uDFE0</span>Home</button>' +
        '<button data-tab="send" class="' + (tab === "send" ? "on" : "") + '"><span class="e">\uD83D\uDCE4</span>Send</button>' +
        '<button data-tab="bills" class="' + (tab === "bills" ? "on" : "") + '"><span class="e">\uD83D\uDCCB</span>Bills</button>' +
        '<button data-tab="history" class="' + (tab === "history" ? "on" : "") + '"><span class="e">\uD83D\uDCCB</span>Activity</button>' +
      '</div>' +
      modalHTML();
  }

  /* ---------- actions ---------- */
  function doLogin(user, pin) {
    user = (user || "").trim().toLowerCase();
    if (!DB.users[user] || DB.users[user].pin !== pin) {
      toast("Wrong username or PIN", true);
      return;
    }
    me = user;
    try { sessionStorage.setItem(SESSION_KEY, me); } catch (e) {}
    tab = "home";
    render();
    toast("Welcome back, " + DB.users[me].name);
  }

  function doRegister(name, user, pin) {
    name = (name || "").trim();
    user = (user || "").trim().toLowerCase();
    if (!/^[a-z0-9_]{3,16}$/.test(user)) {
      toast("Username: 3–16 letters, numbers or _", true);
      return;
    }
    if (!/^\d{4}$/.test(pin)) {
      toast("PIN must be exactly 4 digits", true);
      return;
    }
    if (DB.users[user]) {
      toast("Username already taken", true);
      return;
    }
    DB.users[user] = { name: name || user, pin: pin, balance: 500, tx: [] };
    setDB(DB);
    me = user;
    try { sessionStorage.setItem(SESSION_KEY, me); } catch (e) {}
    tab = "home";
    render();
    toast("Account created! \u20B1500 free credit");
  }

  function doTopup(amount) {
    amount = round2(Number(amount));
    if (!(amount > 0) || amount > MAX_AMOUNT) {
      toast("Enter a valid amount", true);
      return;
    }
    var u = DB.users[me];
    u.balance = round2(u.balance + amount);
    var tx = { type: "topup", amount: amount, ts: Date.now(), ref: newRef(), other: "cash" };
    u.tx.unshift(tx);
    setDB(DB);
    modal = { type: "receipt", tx: tx };
    render();
  }

  function doSend(to, amount, note) {
    to = (to || "").trim().toLowerCase();
    amount = round2(Number(amount));
    note = (note || "").trim();
    if (!DB.users[to]) {
      toast("User not found", true);
      return;
    }
    if (to === me) {
      toast("Cannot send to yourself", true);
      return;
    }
    if (!(amount > 0) || amount > MAX_AMOUNT) {
      toast("Enter a valid amount", true);
      return;
    }
    var u = DB.users[me];
    if (u.balance < amount) {
      toast("Insufficient balance", true);
      return;
    }
    u.balance = round2(u.balance - amount);
    DB.users[to].balance = round2(DB.users[to].balance + amount);
    var ref = newRef();
    var ts = Date.now();
    var outTx = { type: "send", amount: amount, ts: ts, ref: ref, other: to, note: note };
    var inTx  = { type: "received", amount: amount, ts: ts, ref: ref, other: me, note: note };
    u.tx.unshift(outTx);
    DB.users[to].tx.unshift(inTx);
    setDB(DB);
    modal = { type: "receipt", tx: outTx };
    render();
  }

  function doBill(amount, ref) {
    amount = round2(Number(amount));
    ref = (ref || "").trim();
    if (!(amount > 0) || amount > MAX_AMOUNT) {
      toast("Enter a valid amount", true);
      return;
    }
    if (!ref) {
      toast("Enter the " + (BILLERS[biller].field || "reference"), true);
      return;
    }
    var u = DB.users[me];
    if (u.balance < amount) {
      toast("Insufficient balance", true);
      return;
    }
    u.balance = round2(u.balance - amount);
    var token = newRef();
    var tx = { type: "bill", amount: amount, ts: Date.now(), ref: token, other: biller, note: ref };
    u.tx.unshift(tx);
    setDB(DB);
    biller = null;
    modal = { type: "receipt", tx: tx };
    render();
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-action],[data-tab],[data-auth],[data-biller],[data-chip]");
    if (!t) return;

    if (t.dataset.auth) {
      authMode = t.dataset.auth;
      renderAuth();
      return;
    }
    if (t.dataset.tab) {
      tab = t.dataset.tab;
      biller = null;
      modal = null;
      render();
      return;
    }
    if (t.dataset.biller) {
      biller = t.dataset.biller;
      render();
      return;
    }
    if (t.dataset.chip) {
      var inp = document.querySelector("#f-topup input[name=amount]");
      if (inp) inp.value = t.dataset.chip;
      return;
    }

    var act = t.dataset.action;
    if (act === "logout") {
      me = null;
      try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
      authMode = "login";
      renderAuth();
      return;
    }
    if (act === "reset") {
      if (confirm("Reset all demo data?")) {
        DB = seed();
        setDB(DB);
        me = null;
        try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
        authMode = "login";
        renderAuth();
        toast("Demo data reset");
      }
      return;
    }
    if (act === "toggle-bal") {
      hideBal = !hideBal;
      render();
      return;
    }
    if (act === "open-topup") {
      modal = { type: "topup" };
      render();
      return;
    }
    if (act === "close-modal") {
      modal = null;
      render();
      return;
    }
    if (act === "back-biller") {
      biller = null;
      render();
      return;
    }
  });

  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === "f-login") {
      doLogin(f.user.value, f.pin.value);
    } else if (f.id === "f-register") {
      doRegister(f.name.value, f.user.value, f.pin.value);
    } else if (f.id === "f-topup") {
      doTopup(f.amount.value);
    } else if (f.id === "f-send") {
      doSend(f.to.value, f.amount.value, f.note.value);
    } else if (f.id === "f-bill") {
      doBill(f.amount.value, f.ref.value);
    }
  });

  /* ---------- start ---------- */
  render();

  
})();
</script>
</body>
</html>
